[project]
name = "gb-power-data"
version = "0.1.0"
description = "Pillswood battery dispatch and Calibra claim ledger on real Elexon price data"
readme = "README.md"
authors = [
    { name = "Andre" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "blast-lite>=1.1.1",
    "dspy>=3.4",
    "duckdb>=1.5.6",
    "elexon-bmrs>=0.3.0",
    "highspy>=1.15.1",
    "jinja2>=3.1.6",
    "linopy>=0.9.1",
    "mcp>=2.3,<3",
    "pandas>=2.3.3",
    "pandera>=0.33.1",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pydantic>=2",
    "pypsa>=1.4.0",
    "rainflow>=3.2.0",
    "zenml[local]>=0.97.0",
]

[project.scripts]
gbpd-find-bmu = "gb_power_data.ingest.bmunits:main"
gbpd-prices = "gb_power_data.ingest.prices:main"
gbpd-validate = "gb_power_data.validate.prices:main"
gbpd-pipeline = "gb_power_data.pipelines.prices:main"
gbpd-dispatch = "gb_power_data.optimise.run_day:main"
gbpd-backtest = "gb_power_data.claims.run_backtest:main"
gbpd-calibrate = "gb_power_data.calibration.run_calibrate:main"
gbpd-mcp = "gb_power_data.mcp_server.server:main" 
gbpd-agent = "gb_power_data.agent.dispatch_agent:main"
gbpd-physics = "gb_power_data.physics.run_physics:main"
gbpd-report = "gb_power_data.report.cli:main"
gbpd-value = "gb_power_data.value.run_value:main"
gbpd-crosscheck = "gb_power_data.crosscheck.cli:main"
gbpd-verify = "gb_power_data.ledger.verify_cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ", "C4"]
ignore = ["C408"]
